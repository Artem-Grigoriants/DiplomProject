
services:
  web:
    build:
      context: ./  # The context should point to the directory containing the Dockerfile
      dockerfile: Dockerfile
    container_name: django_app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app  # Since docker-compose.yml is in 'src', this mounts 'src' as '/app'
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aeg19802402
      POSTGRES_DB: postgres
      POSTGRES_HOST: db

  db:
    image: postgres:13
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aeg19802402
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  worker:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: django_worker
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    restart: always

  beat:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: django_beat
    command: celery -A config.celery beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - redis
      - db
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDBEAT_REDIS_URL: redis://redis:6379/2
    restart: always

volumes:
  postgres_data: